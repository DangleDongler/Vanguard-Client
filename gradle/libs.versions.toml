[versions]
# Fabric (https://fabricmc.net/develop)
jdk = "21"
minecraft = "1.21.11"
# The oldest loader the bundled Fabric API modules accept. The mod is compiled against it and
# fabric.mod.json requires at least this version, so any newer loader works too.
fabric-loader = "0.17.3"
fabric-api = "0.141.6+1.21.11"

# Testing
junit = "6.1.3"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.18.2"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
# 1.21.11 is obfuscated, so it needs the remapping variant of Loom.
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
